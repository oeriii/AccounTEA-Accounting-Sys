<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Accountea</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script src="theme.js"></script>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="side-top">
          <button type="button" class="theme-toggle" role="switch" aria-checked="true" aria-label="Dark mode" title="Switch between light and dark mode">
            <span class="tt-icon tt-sun">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </span>
            <span class="tt-icon tt-moon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
            </span>
            <span class="tt-knob"></span>
          </button>
        </div>

        <div class="brand">
          <span class="wordmark">Accoun<span class="tea">TEA</span></span>
        </div>

        <nav id="tabs"></nav>

      </aside>

      <div class="main">
        <div class="main-inner">
          <h1 id="page-title"></h1>
          <section class="stats" id="stats"></section>
          <main id="content"></main>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
